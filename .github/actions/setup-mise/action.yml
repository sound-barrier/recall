name: Set up mise (pinned)
description: >
  Install the pinned mise binary and the requested slice of mise.toml's
  toolchain, and load mise.toml [env] into $GITHUB_ENV. The only place the repo
  calls jdx/mise-action, so the mise version and its checksum live in one file.

# Without `sha256`, mise-action checks the mise binary, freshly downloaded or
# restored from its cache, against the release's minisign-signed
# SHASUMS256.txt. With `sha256` set, it skips minisign and hashes the binary
# instead, on every run, so this hash is the trust root for every tool mise
# installs afterwards. A cached binary is hashed BEFORE it ever runs, and one
# that fails the check is deleted and reinstalled.
#
# A cache hit is still weaker for the tools. mise-action never re-verifies the
# tool installs restored with the binary, and `mise install` then skips them as
# present, so for those the Actions cache is the trust root. A job holding a
# write or OIDC token should pass cache: 'false'.
#
# The hash is the RAW linux-x64 binary, which is what mise-action extracts on
# an x64 ubuntu runner. It fails closed anywhere else (macOS, Windows, arm64,
# musl), so only use this action on x64 Linux runners.
#
# Bumping mise: take the `./mise-vX.Y.Z-linux-x64` line (not a .tar.* line)
# from that release's SHASUMS256.txt, after verifying SHASUMS256.txt.minisig
# against mise's minisign key. In the same commit, change `version` and
# `sha256`, set mise.toml's min_version and scripts/install-mise.sh (the
# devcontainer and Debian bootstrap, with its linux-arm64 hash too) to the same
# version, and regenerate mise.lock with that exact mise binary: mise-action
# installs with --locked whenever the lock exists, and a mise older than the
# lockfile format fails.

inputs:
  install_args:
    description: Tools to install, passed to `mise install` (for example `go task`).
    required: true
  cache:
    description: >
      'false' neither restores nor saves the ~/.local/share/mise cache, for jobs
      whose output must not depend on a cache another run wrote.
    required: false
    default: 'true'
  github_token:
    description: >
      Used as MISE_GITHUB_TOKEN by this action's own mise calls only; later
      steps in the job do not see it (mise-action's persist_github_token stays
      at its default, false, and nothing here needs it). Pass '' when the tools
      need no GitHub API and the job token is worth more than the rate limit.
      mise-action then logs a "No MISE_GITHUB_TOKEN provided" warning
      annotation on every run; that is expected, not a regression.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
      with:
        version: '2026.9.16'
        sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
        install_args: ${{ inputs.install_args }}
        cache: ${{ inputs.cache }}
        github_token: ${{ inputs.github_token }}
