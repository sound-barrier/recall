# Publish three artifacts to GitHub Pages:
#
#   1. The user-facing documentation book (Honkit) — built from
#      book/ + the staged-in docs/*.md chapters. Lives at the Pages
#      root: https://sound-barrier.github.io/recall/
#
#   2. The Swagger UI rendering of api/openapi.yaml. Lives at
#      https://sound-barrier.github.io/recall/api/ — same URL the
#      book's sidebar "API reference" link points at.
#
#   3. The live reference-data channel: heroes.yaml + maps.yaml +
#      screenshot_sources.yaml + per-file .sha256 sidecars +
#      version.json (commit SHA + ISO timestamp). Lives at
#      https://sound-barrier.github.io/recall/data/. Consumed by
#      Recall's "Sync from main" path in the update modal so users
#      can pick up new heroes/maps/capture-tool grammars between
#      release tags without a binary upgrade. SHA-256 sidecars use
#      the same `<64-char hex>  <filename>` format the release flow
#      publishes (parser-side `verifySha256` checks them).
#
# Auto-deploys whenever the book scaffold, the docs/ chapters, the
# spec, the parser YAML rosters, or this workflow itself changes on
# main.
#
# One-time setup: Repo Settings → Pages → Build and deployment →
# Source = "GitHub Actions". Without it, deploy-pages fails with
# "Get Pages site failed".
#
# Security: two jobs, so the npm code that builds the book never holds
# a token that can publish. `build` runs mise, `npm ci` and Honkit with
# contents: read only and hands the rendered book over as the plain
# `pages-book` artifact. `deploy` holds pages: write and id-token: write
# and runs no mise, npm or third-party code: from its own checkout it
# stages the API reference and the reference-data channel (the YAML the
# app verifies against the .sha256 sidecars published beside it), after
# deleting any api/ or data/ the artifact carried, then publishes. The
# book HTML is the only thing the unprivileged job decides. The artifact
# must never be named github-pages: deploy-pages takes the one artifact
# of that name in the run, which only upload-pages-artifact may create.
#
# The one ${{ }} expansion below: page_url is a step output from
# actions/deploy-pages — generated inside this workflow, not a webhook
# payload field. Not an injection vector.

name: Pages

on:
  push:
    branches: [main]
    # Skip the deploy when only Go / Vue / Docker / tests change.
    paths:
      - 'api/openapi.yaml'
      - 'docs/**'
      - 'book/**'
      - 'testdata/**'
      - 'pkg/parser/heroes.yaml'
      - 'pkg/parser/maps.yaml'
      - 'pkg/parser/screenshot_sources.yaml'
      - 'pkg/parser/seasons.yaml'
      - 'pkg/parser/ranks.yaml'
      - 'pkg/parser/patches.yaml'
      - 'tools/package.json'
      - 'tools/package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pages best practice: only one in-flight deploy, but never cancel
# a running deploy — cancellation can leave the live site mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

# Honkit is pinned in tools/package-lock.json, shared with the
# `task pages-build` target.

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # node (for the Honkit build) from mise.toml's pin. No token: node needs
      # no GitHub API. No cache: this job's output is published, so it must not
      # depend on a mise install another run restored. The rate-limit warning
      # mise-action logs without a token is expected.
      - uses: ./.github/actions/setup-mise
        with:
          install_args: node
          cache: 'false'
          github_token: ''

      # Honkit exactly as tools/package-lock.json records it, with install
      # scripts off. npm directly rather than `task tools-install`: this job
      # has no task binary, and it runs no Go, so the Go-walker sentinel that
      # task writes into tools/node_modules is not needed here.
      - name: Install pinned npm tools (tools/)
        run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund

      # Stage book/ + the chapter copies into a fresh build
      # directory so the committed book/ stays pure metadata. Two
      # reasons this matters:
      #   1. Honkit reads .gitignore from its source dir and skips
      #      matching files. If chapter filenames are listed in
      #      book/.gitignore (so local preview doesn't dirty git),
      #      Honkit silently produces a 1-page book.
      #   2. Keeping source and derived files separate makes the
      #      build idempotent and removes any "did I forget to
      #      clean up after preview" ambiguity.
      - name: Stage book build directory
        run: |
          mkdir -p _stage/book
          cp -R book/. _stage/book/
          cp docs/install-windows.md      _stage/book/install-windows.md
          cp docs/how-it-works.md         _stage/book/how-it-works.md
          cp docs/settings-reference.md   _stage/book/settings-reference.md
          cp docs/filtering.md            _stage/book/filtering.md
          cp docs/reading-your-climb.md   _stage/book/reading-your-climb.md
          cp docs/reviews.md              _stage/book/reviews.md
          cp docs/unknown-screenshots.md  _stage/book/unknown-screenshots.md
          cp docs/feedback.md             _stage/book/feedback.md
          cp docs/faq.md                  _stage/book/faq.md
          cp docs/privacy.md              _stage/book/privacy.md
          # Mirror testdata/ into the staged book so how-it-works.md's
          # example-screenshot images resolve via the same
          # `testdata/foo.png` relative path used in the README.
          mkdir -p _stage/book/testdata
          cp testdata/*.png _stage/book/testdata/
          # Same pattern for the in-app UI screenshots embedded near
          # the top of how-it-works.md (and reused at the top of the
          # README). Reference as `screenshots/foo.png` from chapters
          # in docs/ — the relative path resolves identically in
          # GitHub-rendered docs/ and in the staged Honkit book root.
          mkdir -p _stage/book/screenshots
          cp docs/screenshots/*.png _stage/book/screenshots/
          # The committed .gitignore lists no chapter filenames (the
          # docs are the source of truth), but blow it away inside
          # the staging dir to be defensive against future drift.
          rm -f _stage/book/.gitignore

      # Honkit resolves SUMMARY.md chapter paths relative to its
      # working directory, not the source arg, so run from inside
      # the staged book dir.
      - name: Build the book (Honkit)
        working-directory: _stage/book
        run: '"${GITHUB_WORKSPACE}/tools/node_modules/.bin/honkit" build . _book'

      # A plain run artifact, deliberately NOT named github-pages (see header).
      - name: Upload the book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pages-book
          path: _stage/book/_book/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so version.json's commit_sha/committed_at can be read
          # from the roster files' last-change commit, not just the shallow tip.
          fetch-depth: 0

      # Final Pages tree:
      #   _site/                — book index.html + per-chapter HTML (build job)
      #   _site/api/index.html  — Swagger UI shell
      #   _site/api/openapi.yaml — the spec the shell loads
      #   _site/data/<name>.yaml + <name>.yaml.sha256 — live reference
      #                                                 data channel
      #   _site/data/version.json — commit SHA + ISO timestamp
      - name: Download the book
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pages-book
          path: _site

      # From this job's checkout, never the artifact: rm first, so nothing the
      # build job wrote under api/ survives into the published site.
      - name: Stage API reference from this checkout
        run: |
          rm -rf _site/api
          mkdir -p _site/api
          cp docs/api/index.html api/openapi.yaml _site/api/

      # Live reference-data channel. Each YAML is published with a
      # SHA-256 sidecar matching the format pkg/gamedata/update_http.go's
      # verifySha256 consumes ("<64-char hex>  <filename>\n"). On
      # ubuntu-24.04 `sha256sum` ships in coreutils; macOS would need
      # `shasum -a 256` but pages.yml runs Linux only. Staged from this
      # job's checkout after deleting any data/ the book artifact carried,
      # so the hashes the app trusts are computed where no npm code ran.
      - name: Stage live reference-data channel from this checkout
        run: |
          rm -rf _site/data
          mkdir -p _site/data
          for name in heroes.yaml maps.yaml screenshot_sources.yaml seasons.yaml ranks.yaml patches.yaml; do
            cp "pkg/parser/${name}" "_site/data/${name}"
            ( cd _site/data && sha256sum "${name}" > "${name}.sha256" )
          done
          # version.json identifies the roster the app compares against. Derive
          # BOTH fields from the last commit that actually touched a roster YAML,
          # not the triggering commit — this workflow also fires on
          # docs/openapi/testdata pushes, and re-stamping version.json on those
          # would make the app report a "new" data commit (and a fresher "N days
          # old") when heroes & maps are byte-identical. Keying off the roster
          # files keeps the published version stable until the rosters move.
          roster_paths="pkg/parser/heroes.yaml pkg/parser/maps.yaml pkg/parser/screenshot_sources.yaml pkg/parser/seasons.yaml pkg/parser/ranks.yaml pkg/parser/patches.yaml"
          # shellcheck disable=SC2086  # roster_paths is a fixed, space-safe list
          commit_sha="$(git -C . log -1 --format=%H  -- $roster_paths)"
          # shellcheck disable=SC2086
          committed_at="$(git -C . log -1 --format=%cI -- $roster_paths)"
          # Fallback to the deployed commit if the path log came back empty
          # (e.g. a shallow checkout before fetch-depth:0 took effect).
          commit_sha="${commit_sha:-${GITHUB_SHA}}"
          committed_at="${committed_at:-$(git -C . log -1 --format=%cI HEAD)}"
          printf '{\n  "commit_sha": "%s",\n  "committed_at": "%s"\n}\n' \
            "${commit_sha}" "${committed_at}" > _site/data/version.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
