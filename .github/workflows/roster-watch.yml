# The twice-weekly watch on the game data.
#
# Recall's model rests on six YAML files that say what exists in Overwatch, and
# before this lane they moved only when a human noticed. The cost of not
# noticing is recorded in the repo itself: a map shipped as "Neon Function", an
# OCR garble made canonical, and every match on it filed under a name that does
# not exist — for seven weeks.
#
# This runs cmd/roster-watch against Blizzard's own hero page, their patch-notes
# list, and the upstream map list, and opens a DRAFT pull request with the
# entries it is confident in. It never merges anything, never writes
# seasons.yaml, and marks every entry unconfirmed: a name from a web page is a
# candidate, and only a scoreboard makes it true.
#
# It cannot become a required status check — it never runs on pull_request — so
# a Blizzard redesign fails this lane and nothing else.
#
# Two jobs, so the token that can push never meets the code that reads the web.
# `watch` scrapes, installs Tesseract from a PPA and runs the golden corpus with
# a read-only token, then uploads its YAML edits as a patch. `propose` holds
# contents: write and pull-requests: write, runs no downloaded toolchain, and
# applies that patch only if it edits nothing but existing pkg/parser/*.yaml
# files, before it pushes the branch and opens the draft PR.
name: Roster watch

on:
  schedule:
    # Wednesday and Saturday, 08:23 UTC. Off the top of the hour like
    # golden-corpus, and clear of CodeQL's Monday 06:00 and Dependabot's Sunday.
    #
    # These two days are measured, not chosen by feel. Against a year of real
    # patch notes (50 patches, 2025-09 .. 2026-08) Overwatch patches fall into
    # TWO clusters, and that is the whole reason for two runs:
    #
    #   Mon 1, Tue 21          -> 22 patches, swept up by the Wednesday run
    #   Wed 8, Thu 16, Fri 4   -> 28 patches, swept up by the Saturday run
    #
    # There IS a Tuesday rhythm, but it covers less than it looks. Season
    # starts are all Tuesday 19:00Z and the big drops land 0/14/28/42 days in
    # -- yet that beat accounts for only 12 of the 33 patches in the four 2026
    # seasons. Those 12 are the ones that carry new heroes and maps, so they
    # matter most; the other 21 are off-beat hotfixes skewing Thursday (9) and
    # Wednesday (7). Tuning the schedule to the beat alone would miss the
    # bigger half.
    #
    # Two clusters is why ONE run a week cannot do this job -- it can sit after
    # one of them, never after both. Thursday, the first cut of this lane, was
    # the worst of the seven: it fires in the morning, hours BEFORE Thursday's
    # own 16 patches go live, then does not look again for a week, leaving 20
    # of the 50 unseen for more than five days. Wed+Sat is the best of all 21
    # day-pairs (2.7d worst case, 1.2d mean, vs 6.7d and 3.1d for Thursday
    # alone), and it is the STABLE one: Blizzard publishes no patch time, so
    # the ranking was swept across every plausible release hour and this pair
    # moves 0.3d across that whole range where the alternatives swing a day.
    #
    # Twice a week costs nothing extra. A run that finds nothing exits 0 having
    # made three HTTP requests, the golden corpus runs only when entries were
    # actually written, and roster-watch-pr.sh force-pushes ONE branch and
    # edits ONE draft PR -- so the second run of a week refreshes that PR
    # rather than opening another.
    - cron: '23 8 * * 3,6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One watch at a time; a scheduled run is never worth canceling for a newer
  # one, because the branch it force-updates is shared.
  group: roster-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      code: ${{ steps.watch.outputs.code }}
      proposed: ${{ steps.package.outputs.proposed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history: the published-channel check compares against the last
          # commit that TOUCHED a roster file, which a shallow clone cannot
          # find. Same reason pages.yml fetches everything.
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise
        with:
          # Only Go — the watch needs no linters and no frontend toolchain.
          install_args: go
          # Go needs no GitHub API, and the export would hand this job's token
          # to every later step, including the scrape. The rate-limit warning
          # mise-action logs without a token is expected.
          github_token: ''

      - name: Read the roster against the game
        id: watch
        run: |
          set +e
          commit="$(git log -1 --format=%H -- pkg/parser/heroes.yaml pkg/parser/maps.yaml \
            pkg/parser/seasons.yaml pkg/parser/patches.yaml pkg/parser/ranks.yaml \
            pkg/parser/screenshot_sources.yaml)"
          go run ./cmd/roster-watch \
            --apply \
            --commit "${commit}" \
            --season "Found $(date -u +%Y-%m-%d) by the roster watch" \
            --accepted scripts/ci/roster-watch-accepted.txt > report.md
          code=$?
          set -e
          cat report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          # 2 means an upstream could not be read. Failing loudly is the whole
          # point: a scrape that quietly reports "in sync" does so in exactly
          # the week the answer stopped being true.
          if [ "${code}" -eq 2 ]; then
            echo "::error::roster-watch could not read an upstream source — the scrape needs fixing"
            exit 1
          fi

      - name: Check the proposed entries against the golden corpus
        # Only when the tool actually wrote something. A hero or map name can
        # change how images that never contained it parse — adding "Mizuki"
        # once made two Mei screenshots read as Mizuki — and this is the only
        # gate that catches it. A PR opened by the Actions token gets no CI, so
        # it runs HERE rather than waiting for a check that never arrives.
        id: golden
        if: steps.watch.outputs.code == '1'
        run: |
          if git diff --quiet -- pkg/parser; then
            echo "no roster edits were written — skipping the corpus" > golden.txt
            exit 0
          fi
          git submodule update --init --depth 1 testdata/images
          bash scripts/ci/install-tesseract.sh
          if go test -run 'TestParseScreenshot_GoldenFiles' -timeout 35m ./pkg/parser/ > golden-raw.txt 2>&1; then
            echo "PASS — no goldens flipped against the proposed entries" > golden.txt
          else
            {
              echo "FAILED — the proposed entries change how existing screenshots parse."
              echo "Every flip below is real parser behavior under the new roster, not a bug."
              echo
              grep -E 'parse mismatch|--- FAIL' golden-raw.txt | head -40
            } > golden.txt
          fi
          cat golden.txt >> "${GITHUB_STEP_SUMMARY}"

      # The proposal is the tool's YAML edits as a patch, plus the report and
      # the corpus result that become the PR body. Nothing else leaves this job.
      - name: Package the proposal
        id: package
        if: steps.watch.outputs.code == '1'
        env:
          PROPOSAL_DIR: ${{ runner.temp }}/proposal
        run: |
          if git diff --quiet -- 'pkg/parser/*.yaml'; then
            echo "proposed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p "${PROPOSAL_DIR}"
          git diff --binary -- 'pkg/parser/*.yaml' > "${PROPOSAL_DIR}/roster.patch"
          cp report.md golden.txt "${PROPOSAL_DIR}/"
          echo "proposed=true" >> "${GITHUB_OUTPUT}"

      - name: Upload the proposal
        if: steps.package.outputs.proposed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roster-watch-proposal
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error
          retention-days: 3

  propose:
    needs: watch
    if: needs.watch.outputs.proposed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the proposal branch
      pull-requests: write   # open / update the draft PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: roster-watch-proposal
          path: ${{ runner.temp }}/proposal

      # The patch came from a job that ran web-scraping and PPA code, so it is
      # untrusted here. `git apply --include` alone is no boundary: its pattern
      # lets `*` cross `/` and it matches a rename by its target. The boundary
      # is the `git status` check after the apply, which allows only edits to
      # existing pkg/parser/<name>.yaml files. The checks before it stop a
      # hostile patch from touching the checkout at all: its headers, and every
      # name git reads from it (old or new, header-less hunks included), must
      # be such a file.
      - name: Apply the proposal (pkg/parser YAML edits only)
        env:
          PATCH: ${{ runner.temp }}/proposal/roster.patch
        run: |
          set -euo pipefail
          headers="$(grep -E '^diff --git ' "${PATCH}" || true)"
          if [ -z "${headers}" ]; then
            echo "::error::the roster patch has no git diff header"
            exit 1
          fi
          if grep -vE '^diff --git a/(pkg/parser/[a-z_]+\.yaml) b/\1$' <<<"${headers}"; then
            echo "::error::the roster patch names a path other than pkg/parser/<name>.yaml (above)"
            exit 1
          fi
          if grep -nE '^(rename|copy) (from|to|old|new) |^(new|deleted) file mode |^(old|new) mode ' "${PATCH}"; then
            echo "::error::the roster patch renames, copies, creates, deletes or re-modes a file (above)"
            exit 1
          fi
          # One `Checking patch <name>...` line per patch git parsed, or
          # `<old> => <new>...` when the names differ (numstat shows only <new>).
          if ! checked="$(LC_ALL=C git apply --check --verbose "${PATCH}" 2>&1)"; then
            printf '%s\n' "${checked}"
            echo "::error::the roster patch does not apply"
            exit 1
          fi
          if grep -E '^Checking patch ' <<<"${checked}" \
            | grep -vE '^Checking patch pkg/parser/[a-z_]+\.yaml\.\.\.$'; then
            echo "::error::git reads the roster patch as touching a path other than pkg/parser/<name>.yaml (above)"
            exit 1
          fi
          git apply --include='pkg/parser/*.yaml' --verbose "${PATCH}"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -z "${status}" ]; then
            echo "::error::the roster patch applied no change"
            exit 1
          fi
          if grep -vE '^ M pkg/parser/[a-z_]+\.yaml$' <<<"${status}"; then
            echo "::error::after the roster patch the checkout differs outside pkg/parser/<name>.yaml (above)"
            exit 1
          fi

      # The token reaches git only in this step, through gh's credential
      # helper, never through .git/config.
      - name: Open or update the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/proposal/report.md
          GOLDEN_FILE: ${{ runner.temp }}/proposal/golden.txt
        run: |
          gh auth setup-git
          bash scripts/ci/roster-watch-pr.sh
