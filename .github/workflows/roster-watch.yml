# The twice-weekly watch on the game data.
#
# Recall's model rests on six YAML files that say what exists in Overwatch, and
# before this lane they moved only when a human noticed. The cost of not
# noticing is recorded in the repo itself: a map shipped as "Neon Function", an
# OCR garble made canonical, and every match on it filed under a name that does
# not exist — for seven weeks.
#
# This runs cmd/roster-watch against Blizzard's own hero page, their patch-notes
# list, and the upstream map list, and opens a DRAFT pull request with the
# entries it is confident in. It never merges anything, never writes
# seasons.yaml, and marks every entry unconfirmed: a name from a web page is a
# candidate, and only a scoreboard makes it true.
#
# It cannot become a required status check — it never runs on pull_request — so
# a Blizzard redesign fails this lane and nothing else.
name: Roster watch

on:
  schedule:
    # Wednesday and Saturday, 08:23 UTC. Off the top of the hour like
    # golden-corpus, and clear of CodeQL's Monday 06:00 and Dependabot's Sunday.
    #
    # These two days are measured, not chosen by feel. Against a year of real
    # patch notes (50 patches, 2025-09 .. 2026-08) Overwatch ships on a 14-day
    # beat anchored to each season start -- offsets 0, 14, 28 and 42 days recur
    # in every season -- and every season start is a Tuesday, so the whole
    # content calendar is Tuesday-anchored: 21 of the 50 landed on a Tuesday,
    # 16 on a Thursday, the rest Wed/Fri.
    #
    # That spread is why ONE run a week cannot do this job. Whichever day it
    # picks, some patch lands just after it and waits nearly a week: a single
    # Thursday run -- the first cut of this lane -- left 20 of the 50 unseen
    # for more than five days, because it fires hours BEFORE Thursday's own
    # patches and then does not look again. Wed+Sat is the best of all 21
    # day-pairs (2.7d worst case, 1.2d mean, vs 6.7d and 3.1d for Thursday
    # alone), and it is the STABLE one: Blizzard publishes no patch time, so
    # the ranking was swept across every plausible release hour and this pair
    # moves 0.3d across that whole range where the alternatives swing a day.
    #
    # Twice a week costs nothing extra. A run that finds nothing exits 0 having
    # made three HTTP requests, the golden corpus runs only when entries were
    # actually written, and roster-watch-pr.sh force-pushes ONE branch and
    # edits ONE draft PR -- so the second run of a week refreshes that PR
    # rather than opening another.
    - cron: '23 8 * * 3,6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One watch at a time; a scheduled run is never worth canceling for a newer
  # one, because the branch it force-updates is shared.
  group: roster-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push the proposal branch
      pull-requests: write   # open / update the draft PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the published-channel check compares against the last
          # commit that TOUCHED a roster file, which a shallow clone cannot
          # find. Same reason pages.yml fetches everything.
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          # Only Go — the watch needs no linters and no frontend toolchain.
          install_args: go

      - name: Read the roster against the game
        id: watch
        run: |
          set +e
          commit="$(git log -1 --format=%H -- pkg/parser/heroes.yaml pkg/parser/maps.yaml \
            pkg/parser/seasons.yaml pkg/parser/patches.yaml pkg/parser/ranks.yaml \
            pkg/parser/screenshot_sources.yaml)"
          go run ./cmd/roster-watch \
            --apply \
            --commit "${commit}" \
            --season "Found $(date -u +%Y-%m-%d) by the roster watch" \
            --accepted scripts/ci/roster-watch-accepted.txt > report.md
          code=$?
          set -e
          cat report.md >> "${GITHUB_STEP_SUMMARY}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          # 2 means an upstream could not be read. Failing loudly is the whole
          # point: a scrape that quietly reports "in sync" does so in exactly
          # the week the answer stopped being true.
          if [ "${code}" -eq 2 ]; then
            echo "::error::roster-watch could not read an upstream source — the scrape needs fixing"
            exit 1
          fi

      - name: Check the proposed entries against the golden corpus
        # Only when the tool actually wrote something. A hero or map name can
        # change how images that never contained it parse — adding "Mizuki"
        # once made two Mei screenshots read as Mizuki — and this is the only
        # gate that catches it. A PR opened by the Actions token gets no CI, so
        # it runs HERE rather than waiting for a check that never arrives.
        id: golden
        if: steps.watch.outputs.code == '1'
        run: |
          if git diff --quiet -- pkg/parser; then
            echo "no roster edits were written — skipping the corpus" > golden.txt
            exit 0
          fi
          git submodule update --init --depth 1 testdata/images
          bash scripts/ci/install-tesseract.sh
          if go test -run 'TestParseScreenshot_GoldenFiles' -timeout 35m ./pkg/parser/ > golden-raw.txt 2>&1; then
            echo "PASS — no goldens flipped against the proposed entries" > golden.txt
          else
            {
              echo "FAILED — the proposed entries change how existing screenshots parse."
              echo "Every flip below is real parser behavior under the new roster, not a bug."
              echo
              grep -E 'parse mismatch|--- FAIL' golden-raw.txt | head -40
            } > golden.txt
          fi
          cat golden.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update the draft pull request
        if: steps.watch.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_FILE: report.md
          GOLDEN_FILE: golden.txt
        run: bash scripts/ci/roster-watch-pr.sh
