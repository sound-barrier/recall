name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback for when the tag was created by release-please
  # using the default GITHUB_TOKEN -- GitHub deliberately does not
  # fire workflows on refs authored by GITHUB_TOKEN (loop guard), so
  # the push:tags trigger above never runs for those tags. From the
  # command line: `task release-fire TAG=vX.Y.Z` (wraps the gh CLI),
  # or from the UI: Release -> Run workflow -> pick the tag in the
  # "Use workflow from" dropdown. Every job in this file already
  # keys off github.ref_name, which is the tag name for both
  # triggers. No inputs declared, so nothing untrusted enters the
  # workflow context. See RELEASES.md "When release.yml does not
  # auto-fire" for the long-term fix.
  workflow_dispatch:

permissions: {}  # deny all by default; each job declares only what it needs

# Improvement #4 (audit): serialize concurrent runs against the same tag.
# Two ways the same tag could fire this workflow concurrently: (a) push
# trigger races with workflow_dispatch when a maintainer fires it manually
# after the auto-trigger; (b) re-runs from the UI. cancel-in-progress is
# false because a release run is non-idempotent — softprops creates the
# release once, then races with itself if cancelled mid-upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Recall ships a Windows desktop app only. Linux/macOS desktop builds and the
# self-hosted server container were removed — see RELEASES.md. macOS stays a
# development target (`task dev`) but is never released.
jobs:
  # ── Job 1: Windows app + NSIS installer (native cross-compile, no Docker) ──
  # v3's WebView2 loader is pure Go, so this cross-compiles CGO_ENABLED=0 from
  # Linux — no mingw, no Docker. wails3 generate syso embeds the icon/version;
  # create:nsis:installer fetches the WebView2 bootstrapper + runs makensis.
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      # SignPath's connector downloads the uploaded artifact back out of this
      # run through the GitHub API, which needs the Actions read scope.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Building the wails3 CLI itself (mise/go install) pulls in v3's CGo GTK4
      # webview, so the Ubuntu runner needs the WebKit dev libs — even though the
      # Windows target is CGO_ENABLED=0.
      - uses: ./.github/actions/linux-webview-deps

      - uses: ./.github/actions/wails-build-env

      - name: Install makensis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      # ── Authenticode signing ────────────────────────────────────────
      # Unsigned Go binaries in an unsigned NSIS installer are a textbook
      # Defender false positive, and Recall hit one. Signing is the fix; see
      # docs/signing.md for the SignPath setup this consumes.
      #
      # The order below is the whole point. The installer EMBEDS recall.exe, so
      # the exe is signed BEFORE NSIS packs it -- otherwise the file that
      # actually lands in %LOCALAPPDATA%\Programs\Recall is unsigned and gets
      # flagged at runtime, no matter how well-signed the installer was.
      - name: Check for signing credentials
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: bash scripts/release/signing-status.sh

      - name: Build Windows exe
        run: task build-windows-exe

      - name: Upload unsigned exe for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: unsigned-exe
          path: bin/Recall.exe
          if-no-files-found: error

      - name: Sign the exe
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Install the signed exe
        if: steps.signing.outputs.enabled == 'true'
        run: bash scripts/release/install-signed-artifact.sh signed-exe/Recall.exe bin/Recall.exe

      # Packs whatever bin/Recall.exe now holds -- the signed one, above.
      - name: Build NSIS installer
        run: task build-windows-installer

      - name: Upload unsigned installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: unsigned-installer
          path: bin/recall-amd64-installer.exe
          if-no-files-found: error

      - name: Sign the installer
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Install the signed installer
        if: steps.signing.outputs.enabled == 'true'
        run: |
          bash scripts/release/install-signed-artifact.sh \
            signed-installer/recall-amd64-installer.exe \
            bin/recall-amd64-installer.exe

      - name: Stage to dist/
        run: |
          mkdir -p dist/windows
          cp bin/recall-amd64-installer.exe dist/windows/
          cp bin/Recall.exe dist/windows/

      # Renames to the release filenames. Runs AFTER signing, so the SHA256SUMS
      # and the provenance attestation below both cover the signed bytes --
      # hashing before signing would publish digests for files nobody ships.
      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/release/package-wails-windows.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          # The raw exe (`…-windows-amd64.exe`) is the in-app updater target;
          # the installer (`…-windows-amd64-installer.exe`) is the human
          # download. `…-windows-amd64.exe` matches only the former.
          subject-path: |
            recall-*-windows-amd64-installer.exe
            recall-*-windows-amd64.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-wails-windows
          path: |
            recall-*-windows-amd64-installer.exe
            recall-*-windows-amd64.exe

  # ── Job 2: Generate SBOM from BUILT ARTIFACTS ────────────────────────
  # Improvement #3 (audit): SBOM now describes the shipped bits, not
  # just the source tree. Downloads the build artifacts so syft scans the
  # actual Go binary (catches build-info entries the source-tree scan
  # would miss — indirect deps that vendor brought in, plus any
  # compile-time-resolved version pins). The repo checkout is still in the
  # scan path so syft's go.mod / package.json scanners run too — the
  # resulting SBOM is the union of both passes.
  sbom:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute artifact version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          # Scans repo source AND the built binaries that were downloaded
          # into the workspace.
          path: .
          format: spdx-json
          output-file: recall-${{ steps.ver.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom
          path: recall-${{ steps.ver.outputs.version }}-sbom.spdx.json

  # ── Job 3: Create GitHub Release with the Windows binaries attached ──
  # github.ref_name is used only in an `actions/` `with:` expression, not
  # interpolated into any run: shell command — safe from injection.
  release:
    needs: [build-windows, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write    # needed by Sigstore to mint a short-lived cert
      attestations: write  # needed to write SLSA provenance for sha256 files
    steps:
      # Checkout is required even though this job only consumes artifacts
      # from earlier jobs — the "Generate SHA256 checksums" step shells
      # out to scripts/release/compute-sha256.sh, which lives in the
      # source tree. Without checkout the script is absent from the
      # runner filesystem and the step dies with exit 127.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so the roster-staging step can diff this tag
          # against the previous release and skip unchanged YAMLs.
          fetch-depth: 0

      # Download all artifacts into the current directory (merge-multiple flattens them).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          merge-multiple: true

      # Stage the parser's reference data (heroes.yaml + maps.yaml) as
      # release-versioned assets. The frontend's "verify reference data"
      # affordance downloads these to compare the local parser corpus
      # against the canonical version. Renaming with the tag in the
      # filename keeps each release's data self-describing and prevents an
      # old asset from being mistaken for a newer one if a verifier
      # downloads from the wrong release page.
      - name: Compute artifact version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage reference data YAMLs
        env:
          # Route the tag through an env var rather than interpolating
          # ${{ … }} directly into the run: shell — project convention
          # (see .claude/rules/ci-cd.md "Fixing CI on a remote-authored
          # PR" / build-tooling notes). VERSION is bounded by git's
          # ref-naming rules + the v* push trigger, so there's no
          # injection vector today, but the env-var shape keeps the
          # workflow safe against a future change to the trigger.
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Publish a roster YAML only when it changed since the previous
          # release. Re-attaching a byte-identical file every release just churns
          # assets and makes the app's "what's new" hint noisy; the app walks
          # back to the most recent release that still carries each file
          # (gamedata.FetchReleaseRosters), so omitting an unchanged one is safe.
          prev_tag="$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)"
          echo "Previous release tag: ${prev_tag:-<none>}"
          for name in heroes maps screenshot_sources seasons ranks patches; do
            src="pkg/parser/${name}.yaml"
            if [ -z "$prev_tag" ] \
               || ! git rev-parse -q --verify "${prev_tag}:${src}" >/dev/null 2>&1 \
               || ! git diff --quiet "${prev_tag}" HEAD -- "$src"; then
              cp "$src" "recall-${VERSION}-${name}.yaml"
              echo "staged  recall-${VERSION}-${name}.yaml (changed since ${prev_tag:-<no previous release>})"
            else
              echo "skipped ${name}.yaml (unchanged since ${prev_tag})"
            fi
          done

      # The Windows DB-reset helper (also bundled in the installer). A
      # checked-in source file copied straight into the workspace, like
      # the reference YAMLs — so it's signed + attested the same way.
      - name: Stage Windows reset-DB helper script
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp scripts/windows/Reset-Database.bat "recall-${VERSION}-Reset-Database.bat"

      # SLSA build provenance on the reference-data YAMLs. The Windows build
      # job attested its own outputs in-job; the YAMLs aren't built by any
      # earlier job (they're checked-in source copied straight into the
      # workspace), so the attestation has to fire here in the release job.
      # Verify with:
      #   gh attestation verify recall-X.Y.Z-heroes.yaml \
      #     --repo sound-barrier/recall
      - name: Attest reference data provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            recall-*-heroes.yaml
            recall-*-maps.yaml
            recall-*-screenshot_sources.yaml
            recall-*-seasons.yaml
            recall-*-ranks.yaml
            recall-*-patches.yaml
            recall-*-Reset-Database.bat

      # Per-artifact .sha256 files for every release binary and reference-
      # data YAML, plus the combined SHA256SUMS the in-app updater consumes.
      # Each .sha256 contains the SHA256 hash of exactly one artifact.
      # Users verify with: sha256sum --check recall-<version>-windows-amd64.exe.sha256
      - name: Generate SHA256 checksums
        run: bash scripts/release/compute-sha256.sh

      # Attest the sha256 files so users can prove the checksums themselves
      # came from CI, not a tampered release page. Chain:
      #   gh attestation verify <file>.sha256 → sha256sum --check <file>.sha256
      # This closes the loop: even the fallback verification path is signed.
      - name: Attest SHA256 checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            recall-*.exe.sha256
            recall-*.yaml.sha256
            recall-*.bat.sha256
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          # Tags like v0.0.1-beta or v1.0.0-rc1 contain a hyphen → prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            recall-*.exe
            recall-*.exe.sha256
            recall-*.yaml
            recall-*.yaml.sha256
            recall-*.bat
            recall-*.bat.sha256
            recall-*-sbom.spdx.json
            SHA256SUMS
