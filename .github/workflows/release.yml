name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback for when the tag was created by release-please
  # using the default GITHUB_TOKEN -- GitHub deliberately does not
  # fire workflows on refs authored by GITHUB_TOKEN (loop guard), so
  # the push:tags trigger above never runs for those tags. From the
  # command line: `task release-fire TAG=vX.Y.Z` (wraps the gh CLI),
  # or from the UI: Release -> Run workflow -> pick the tag in the
  # "Use workflow from" dropdown. Every job in this file already
  # keys off github.ref_name, which is the tag name for both
  # triggers. No inputs declared, so nothing untrusted enters the
  # workflow context. See RELEASES.md "When release.yml does not
  # auto-fire" for the long-term fix.
  workflow_dispatch:

permissions: {}  # deny all by default; each job declares only what it needs

# Improvement #4 (audit): serialize concurrent runs against the same tag.
# Two ways the same tag could fire this workflow concurrently: (a) push
# trigger races with workflow_dispatch when a maintainer fires it manually
# after the auto-trigger; (b) re-runs from the UI. cancel-in-progress is
# false because a release run is non-idempotent — softprops creates the
# release once, then races with itself if cancelled mid-upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Recall ships a Windows desktop app only. Linux/macOS desktop builds and the
# self-hosted server container were removed — see RELEASES.md. macOS stays a
# development target (`task dev`) but is never released.
jobs:
  # ── Job 0: Refuse any ref that is not a release-please release commit ──
  # Both triggers take whatever v* tag they are given, and tags are not
  # branch-protected, so a mistaken or stray tag would otherwise choose the
  # commit that gets built, attested and published. Every other job depends
  # on this one. It does not stop a tag pushed on purpose: both triggers run
  # this file and the script as they are at the tagged commit, so a tag on a
  # commit that edits either skips the check, and the edited file sets every
  # job's permissions and which jobs wait for approval. Such a run can attest
  # under this workflow's name and publish a release without anyone's
  # approval; only who can push v* tags limits that. The `release`
  # environment's reviewer, who compares the run's commit with main before
  # approving, keeps RECALL_UPDATE_SIGNING_KEY from it, so its exe carries no
  # valid .sig and a Recall that checks signatures refuses the update. The
  # checks, and why each exists, are in scripts/release/verify-release-ref.sh.
  verify-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag: the ancestry check walks origin/main.
          fetch-depth: 0

      - name: Verify the tag is a release-please commit on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash scripts/release/verify-release-ref.sh

  # ── Job 1: Windows app + NSIS installer (native cross-compile, no Docker) ──
  # v3's WebView2 loader is pure Go, so this cross-compiles CGO_ENABLED=0 from
  # Linux — no mingw, no Docker. wails3 generate syso embeds the icon/version;
  # create:nsis:installer fetches the WebView2 bootstrapper + runs makensis.
  # The build runs npm, wails3 and makensis, so it gets a read-only token and
  # no OIDC token: it can neither publish nor attest what it built.
  build-windows:
    needs: [verify-ref]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.digests.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Building the wails3 CLI itself (mise/go install) pulls in v3's CGo GTK4
      # webview, so the Ubuntu runner needs the WebKit dev libs — even though the
      # Windows target is CGO_ENABLED=0.
      - uses: ./.github/actions/linux-webview-deps

      # No shared mise cache. A tag run can restore any cache a push-to-main
      # run saved, and those jobs run npm packages, test code and third-party
      # actions before the cache is written. mise trusts a restored install
      # without re-checking it (setup-mise's header explains how), so a
      # tampered Go, wails3 or task there would build the shipped binary. The
      # tools install fresh from mise.lock instead.
      - uses: ./.github/actions/wails-build-env
        with:
          cache: 'false'

      - name: Install makensis
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Build Windows app + NSIS installer
        run: task build-windows

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/release/package-wails-windows.sh

      # Every job that downloads these checks them against this output with
      # scripts/release/verify-asset-digests.sh, which explains why.
      - name: Record artifact digests
        id: digests
        run: |
          {
            echo 'sums<<SUMS_END'
            sha256sum -- recall-*-windows-amd64-installer.exe recall-*-windows-amd64.exe
            echo 'SUMS_END'
          } >> "$GITHUB_OUTPUT"

      # The raw exe (`…-windows-amd64.exe`) is the in-app updater target; the
      # installer (`…-windows-amd64-installer.exe`) is the human download.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-wails-windows
          path: |
            recall-*-windows-amd64-installer.exe
            recall-*-windows-amd64.exe
          if-no-files-found: error

  # ── Job 2: Generate SBOM from BUILT ARTIFACTS ────────────────────────
  # Improvement #3 (audit): SBOM now describes the shipped bits, not
  # just the source tree. Downloads the build artifacts so syft scans the
  # actual Go binary (catches build-info entries the source-tree scan
  # would miss — indirect deps that vendor brought in, plus any
  # compile-time-resolved version pins). The repo checkout is still in the
  # scan path so syft's go.mod / package.json scanners run too — the
  # resulting SBOM is the union of both passes.
  sbom:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.digests.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-wails-windows
          path: artifacts

      - name: Verify Windows artifact digests
        env:
          BUILD_SUMS: ${{ needs.build-windows.outputs.sums }}
        run: bash scripts/release/verify-asset-digests.sh artifacts "$BUILD_SUMS"

      - name: Compute artifact version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          # Scans repo source AND the built binaries that were downloaded
          # into the workspace.
          path: .
          format: spdx-json
          output-file: recall-${{ steps.ver.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record SBOM digest
        id: digests
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo 'sums<<SUMS_END'
            sha256sum -- "recall-${VERSION}-sbom.spdx.json"
            echo 'SUMS_END'
          } >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: recall-${{ steps.ver.outputs.version }}-sbom.spdx.json
          if-no-files-found: error

  # ── Job 3: Sign, checksum and attest every release asset ─────────────
  # The one job that can read RECALL_UPDATE_SIGNING_KEY or mint an
  # attestation, and the only job that names the `release` environment: it
  # waits for a maintainer's approval, which comes after the build and SBOM it
  # would sign have finished, and one approval covers the release. Any code in
  # this job can read the key out of the runner's memory, so it runs first-party
  # actions and this repository's code only, and builds the signer from
  # source with no cache and no module download.
  sign-attest:
    needs: [build-windows, sbom]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # Sigstore certificate for the attestation
      attestations: write  # store the attestation on the repository
    outputs:
      sums: ${{ steps.digests.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags so the roster-staging step can diff this tag
          # against the previous release and skip unchanged YAMLs.
          fetch-depth: 0

      - name: Compute artifact version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # cache: false, because a cache saved by any main-branch run could
      # otherwise feed the toolchain that builds the signer.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # pkg/updatesig and cmd/update-signing import only the standard library
      # (a test holds the package to that), so the build needs no download:
      # GOPROXY=off turns a new dependency into a failed build here instead
      # of unreviewed code running beside the key.
      - name: Build the update signer
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOFLAGS: -mod=readonly
          CGO_ENABLED: '0'
        run: go build -trimpath -o "$RUNNER_TEMP/update-signing" ./cmd/update-signing

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-wails-windows
          path: build-artifacts

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: sbom-artifact

      # Each producer in its own directory, held to its own digests and to the
      # names it hands off. The sbom job runs third-party code before it
      # records its digests, so a manifest checked by bytes alone could vouch
      # for an extra file there, and that file would be checksummed, attested
      # and published.
      - name: Verify downloaded artifact digests
        env:
          BUILD_SUMS: ${{ needs.build-windows.outputs.sums }}
          SBOM_SUMS: ${{ needs.sbom.outputs.sums }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash scripts/release/verify-asset-digests.sh build-artifacts "$BUILD_SUMS" \
            "recall-${VERSION}-windows-amd64.exe" \
            "recall-${VERSION}-windows-amd64-installer.exe"
          bash scripts/release/verify-asset-digests.sh sbom-artifact "$SBOM_SUMS" \
            "recall-${VERSION}-sbom.spdx.json"

      # A new directory holding the three verified files and nothing else, so
      # every later step stages into a directory no producer wrote.
      - name: Start the release asset directory
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir release-assets
          mv "build-artifacts/recall-${VERSION}-windows-amd64.exe" \
            "build-artifacts/recall-${VERSION}-windows-amd64-installer.exe" \
            "sbom-artifact/recall-${VERSION}-sbom.spdx.json" \
            release-assets/

      # Stage the parser's reference data (heroes.yaml + maps.yaml) as
      # release-versioned assets. The frontend's "verify reference data"
      # affordance downloads these to compare the local parser corpus
      # against the canonical version. Renaming with the tag in the
      # filename keeps each release's data self-describing and prevents an
      # old asset from being mistaken for a newer one if a verifier
      # downloads from the wrong release page.
      - name: Stage reference data YAMLs
        env:
          # Route the tag through an env var rather than interpolating
          # ${{ … }} directly into the run: shell — project convention
          # (see .claude/rules/ci-cd.md "Fixing CI on a remote-authored
          # PR" / build-tooling notes). VERSION is bounded by git's
          # ref-naming rules + the v* push trigger, so there's no
          # injection vector today, but the env-var shape keeps the
          # workflow safe against a future change to the trigger.
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Publish a roster YAML only when it changed since the previous
          # release. Re-attaching a byte-identical file every release just churns
          # assets and makes the app's "what's new" hint noisy; the app walks
          # back to the most recent release that still carries each file
          # (gamedata.FetchReleaseRosters), so omitting an unchanged one is safe.
          # The diff base is the previous stable tag, never a prerelease: an rc
          # is a draft until a maintainer publishes it, and may never be, and
          # the walk-back cannot see a draft, so a stable release that skipped
          # a roster only the rc carried would leave clients without it.
          prev_tag="$(git describe --tags --abbrev=0 --exclude='v*-*' "v${VERSION}^" 2>/dev/null || true)"
          echo "Previous stable release tag: ${prev_tag:-<none>}"
          for name in heroes maps screenshot_sources seasons ranks patches; do
            src="pkg/parser/${name}.yaml"
            if [ -z "$prev_tag" ] \
               || ! git rev-parse -q --verify "${prev_tag}:${src}" >/dev/null 2>&1 \
               || ! git diff --quiet "${prev_tag}" HEAD -- "$src"; then
              cp "$src" "release-assets/recall-${VERSION}-${name}.yaml"
              echo "staged  recall-${VERSION}-${name}.yaml (changed since ${prev_tag:-<no previous release>})"
            else
              echo "skipped ${name}.yaml (unchanged since ${prev_tag})"
            fi
          done

      # The Windows DB-reset helper (also bundled in the installer). A
      # checked-in source file copied straight into the release assets, like
      # the reference YAMLs — so it's checksummed + attested the same way.
      - name: Stage Windows reset-DB helper script
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp scripts/windows/Reset-Database.bat "release-assets/recall-${VERSION}-Reset-Database.bat"

      # The only step with the key in its environment. The signer refuses a
      # key other than the one pinned in pkg/updatesig/public_key.pem and
      # never replaces an existing .sig.
      - name: Sign the updater exe and installer
        env:
          RECALL_UPDATE_SIGNING_KEY: ${{ secrets.RECALL_UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          "$RUNNER_TEMP/update-signing" sign \
            "release-assets/recall-${VERSION}-windows-amd64.exe" \
            "release-assets/recall-${VERSION}-windows-amd64-installer.exe"

      # The check an installed Recall makes before it updates, run without the
      # key: a signature this refuses never reaches a release.
      - name: Verify signatures
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          "$RUNNER_TEMP/update-signing" verify \
            "release-assets/recall-${VERSION}-windows-amd64.exe" \
            "release-assets/recall-${VERSION}-windows-amd64-installer.exe"

      # Inside release-assets, so SHA256SUMS and every .sha256 name each asset
      # without a directory: the updater and the roster fetch look assets up by
      # bare name, and a prefixed name would leave old clients unverified.
      # Users verify with: sha256sum --check recall-<version>-windows-amd64.exe.sha256
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: bash ../scripts/release/compute-sha256.sh

      # One attestation over every asset, the signatures and checksums with
      # them, so a checksum or .sig can be proven to come from this workflow
      # too. Verify with:
      #   gh attestation verify recall-X.Y.Z-windows-amd64.exe \
      #     --repo sound-barrier/recall
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release-assets/recall-*.exe
            release-assets/recall-*.exe.sig
            release-assets/recall-*.yaml
            release-assets/recall-*.bat
            release-assets/recall-*-sbom.spdx.json
            release-assets/recall-*.sha256
            release-assets/SHA256SUMS

      # The attestation's Sigstore bundle, one JSON line covering every subject
      # above, so a download verifies without GitHub's attestation API
      # (`gh attestation verify ASSET --bundle recall-X.Y.Z.intoto.jsonl
      # --repo sound-barrier/recall`) and Scorecard finds provenance on the
      # release. It cannot be a subject of the attestation it holds, and needs
      # no checksum: its own signature covers it. The name matches neither the
      # updater's exe nor a compute-sha256.sh glob.
      - name: Publish the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: cp "$BUNDLE" "release-assets/recall-${VERSION}.intoto.jsonl"

      - name: Check the release asset set
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/release/check-release-assets.sh release-assets "$VERSION"

      - name: Record release asset digests
        id: digests
        working-directory: release-assets
        run: |
          {
            echo 'sums<<SUMS_END'
            sha256sum -- *
            echo 'SUMS_END'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  # ── Job 4: Create GitHub Release with the signed assets attached ──
  # Publishes exactly what sign-attest checked and recorded, and holds nothing
  # but a token that can write releases. It names no environment, so
  # publishing needs no second approval, and "Re-run failed jobs" retries it
  # alone.
  release:
    needs: [sign-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify release asset digests
        env:
          ASSET_SUMS: ${{ needs.sign-attest.outputs.sums }}
        run: bash scripts/release/verify-asset-digests.sh release-assets "$ASSET_SUMS"

      # github.ref_name is used only in a `with:` expression, not interpolated
      # into any run: shell command — safe from injection.
      # The zizmor ignore sits on the name line: trailing the uses: pin, it
      # would hide the version comment from ref-version-mismatch.
      - name: Create GitHub Release  # zizmor: ignore[superfluous-actions] one call creates the release and uploads every asset (immutable releases)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # Tags like v0.0.1-beta or v1.0.0-rc1 contain a hyphen → prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Releases here are immutable, and GitHub takes no upload once a
          # release is published. The action drafts a stable release, uploads
          # to it, then publishes it, but it creates a prerelease already
          # published unless told to keep a draft. So a prerelease stays a
          # draft with every asset attached, for a maintainer to publish.
          draft: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # Everything sign-attest checked, and nothing else.
          working_directory: release-assets
          files: '*'
          fail_on_unmatched_files: true
