# Golden-corpus parser regression lane.
#
# The fixture corpus (testdata/images submodule + testdata/*.golden.json) is
# the only regression gate for the OCR parser — and before this lane it ran
# nowhere routinely: ci.yml's go-test passes -short (which skips it) and the
# local `task test` -race run blows the 600s package timeout. This lane runs
# the corpus nightly, on demand, and whenever the parser or its fixtures
# change on a PR or on main.
#
# No -race: the corpus is single-flight OCR, not a concurrency test, and
# -race is what made it untenable locally. ci.yml's -short -race run still
# covers the parser's unit surface.
name: Golden corpus

on:
  schedule:
    - cron: '17 9 * * *'  # daily, off the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pkg/parser/**'
      - 'testdata/**'
      - '.github/workflows/golden-corpus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/parser/**'
      - 'testdata/**'
      - '.github/workflows/golden-corpus.yml'

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # testdata/images — the recall-testdata fixture submodule.
          submodules: true

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          # Only Go — the corpus needs no linters or frontend toolchain.
          install_args: go

      - name: Install Tesseract (baseline major.minor)
        # The goldens are baselined against the TESSERACT_VERSION pinned
        # in mise.toml [env] (5.5.2, the maintainer's macOS/Homebrew
        # build). ubuntu-latest's stock apt package is 5.3.x, whose OCR
        # output drifts enough to flip a quarter of the corpus — the
        # alex-p PPA tracks current upstream. The guard fails the job
        # LOUDLY on a major.minor mismatch so environment drift can
        # never masquerade as a parser regression; an intentional
        # baseline bump means re-baseline the goldens + the mise pin.
        run: |
          sudo add-apt-repository -y ppa:alex-p/tesseract-ocr5
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version | head -1
          want="$(grep -E '^TESSERACT_VERSION' mise.toml | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          got="$(tesseract --version 2>&1 | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          if [ "$got" != "$want" ]; then
            echo "::error::Tesseract $got installed, but the goldens are baselined on $want (TESSERACT_VERSION in mise.toml) — fix the install source or re-baseline."
            exit 1
          fi

      - name: Run the golden corpus
        run: go test -run 'TestParseScreenshot_GoldenFiles' -v -timeout 35m ./pkg/parser/
