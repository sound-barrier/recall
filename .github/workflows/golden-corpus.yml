# Golden-corpus parser regression lane.
#
# The fixture corpus (testdata/images submodule + testdata/*.golden.json) is
# the only regression gate for the OCR parser — and before this lane it ran
# nowhere routinely: ci.yml's go-test passes -short (which skips it) and the
# local `task test` -race run blows the 600s package timeout. This lane runs
# the corpus nightly, on demand, and whenever the parser or its fixtures
# change on a PR or on main.
#
# No -race: the corpus is single-flight OCR, not a concurrency test, and
# -race is what made it untenable locally. ci.yml's -short -race run still
# covers the parser's unit surface.
name: Golden corpus

on:
  schedule:
    - cron: '17 9 * * *'  # daily, off the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pkg/parser/**'
      - 'testdata/**'
      - '.github/workflows/golden-corpus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/parser/**'
      - 'testdata/**'
      - '.github/workflows/golden-corpus.yml'

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # testdata/images — the recall-testdata fixture submodule.
          submodules: true

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5
        with:
          # Only Go — the corpus needs no linters or frontend toolchain.
          install_args: go

      - name: Install Tesseract (baseline major.minor)
        # Shared installer: alex-p PPA + a loud major.minor guard against
        # the TESSERACT_VERSION pin. Same script ci.yml's schemathesis job
        # uses — every CI runner OCRs with the engine the goldens were
        # baselined against, and drift names itself instead of
        # masquerading as golden mismatches.
        run: bash scripts/ci/install-tesseract.sh

      - name: Run the golden corpus
        run: go test -run 'TestParseScreenshot_GoldenFiles' -v -timeout 35m ./pkg/parser/
