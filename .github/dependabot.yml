version: 2

# Cooldowns (all three ecosystems below) hold a bump back until its version
# has been public for N days, so a release that gets yanked or hot-fixed
# never reaches a PR here. This repo auto-merges dependency PRs on green CI,
# so "CI passed" is the only gate — and a bad release can pass CI and still
# be wrong. @playwright/test 1.61.0 is the worked example: it shipped, CI
# went green locally, and its Linux WebKit build crashed two e2e specs on
# the runner. It stays exact-pinned to this day — the pin only moves
# deliberately (1.60.0 → 1.62.x once 1.62 was verified against both
# WebKit specs), never through a range resolve.
#
# Cooldown applies to VERSION updates only — per GitHub's reference, "the
# cooldown option is only available for version updates, not security
# updates". Dependabot security PRs still open immediately, so this trades
# nothing away on the CVE path.
#
# Every version update waits one flat 7 days, patch and minor alike: the
# week-long age gate CLAUDE.md sets for both ecosystems. A patch release is
# no less likely to be the compromised one, and for Go this is the only
# mechanical gate (npm also has frontend/.npmrc min-release-age=7), so a
# shorter patch window would let a days-old module into go.sum on a green
# auto-merge. Setting only `default-days` is how that reads: when no
# semver-*-days key is present, Dependabot applies it to every update type.
#
# MAJORS NEVER OPEN A VERSION PR for the grouped ecosystems below. A major
# folded into an auto-merged patch PR is one you merge by reflex —
# dawidd6/action-download-artifact v21->v23 rode in exactly that way, onto
# a release whose own upstream issue says to revert it. Per-ecosystem
# `*-major` groups used to give majors their own PR, but Dependabot
# silently ignores an entry's `groups` once the entry joins a
# multi-ecosystem group (#777 shipped two majors in weekly-deps that way),
# so each grouped entry ignores semver-major instead. Bump majors by hand;
# security updates still open their own PRs, since `ignore` and
# `cooldown` apply to version updates only.
#
# HAND-MERGED: composite-action bumps. The actions under .github/actions/
# set up the release toolchain: setup-mise wraps jdx/mise-action, which
# installs mise and every pinned tool, and wails-build-env runs it for the
# build of the Windows exe users download. A bump there changes what builds
# a release, so it arrives in its own `actions-composite*` PR labeled
# `release-toolchain`, and the maintainer reads and merges it by hand. It
# never rides in the auto-merged `actions` group, which is why the
# workflow pins and the composite pins are two update entries rather than
# one entry with two directories.
#
# ONE ROUTINE PR. Minor and patch bumps from Go, the frontend and tools
# npm trees and the workflow action pins all land in a single weekly
# `weekly-deps` PR (the multi-ecosystem group below) instead of one PR per
# ecosystem — one CI run, one review, one auto-merge. Majors stay out and
# the composite actions keep their own entry, for the reasons above.
#
# HELD DEPENDENCIES are ignored, because one blocked bump would hold the
# whole combined PR red. Each hold is documented where it is enforced;
# lifting one means deleting its ignore here in the same change:
#   - typescript >=6.1 — capped by typescript-eslint's peer range
#     (frontend/CLAUDE.md, "Deliberate npm version holds").
#   - github.com/wailsapp/wails/v3 + @wailsio/runtime — move in lockstep with
#     the wails3 CLI, all three in one commit (CLAUDE.md, "Deliberate
#     version holds"); Dependabot can only ever bump one of the three.

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: "weekly"
    # Group-only key: Dependabot rejects it on the member update entries.
    open-pull-requests-limit: 5

updates:
  # Go modules — updates go.mod deps and the `go X.Y` toolchain directive.
  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: "weekly-deps"
    patterns: ["*"]
    ignore:
      # Majors stay out of weekly-deps — see the header.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Wails lockstep hold — see the header.
      - dependency-name: "github.com/wailsapp/wails/v3"
    cooldown:
      default-days: 7

  # npm (Vue frontend) — Vue, Vite, typescript-eslint, vue-tsc, vitest, etc.
  - package-ecosystem: "npm"
    directory: "/frontend"
    multi-ecosystem-group: "weekly-deps"
    patterns: ["*"]
    ignore:
      # Majors stay out of weekly-deps — see the header.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # TypeScript ceiling — see the header.
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # Wails lockstep hold — see the header.
      - dependency-name: "@wailsio/runtime"
    cooldown:
      default-days: 7

  # npm CLIs the lint, cloc and Pages tasks and the hooks run (listed in
  # tools/package.json). A separate entry so tools/.npmrc's 7-day
  # min-release-age applies when Dependabot rebuilds tools/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/tools"
    multi-ecosystem-group: "weekly-deps"
    patterns: ["*"]
    ignore:
      # Majors stay out of weekly-deps — see the header.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # GitHub Actions workflow pins (setup-go, setup-node, checkout, etc.).
  # "/" reads .github/workflows/*.yml and a root action.yml only, never
  # .github/actions/, so it does not overlap the composite entry below.
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "weekly-deps"
    patterns: ["*"]
    ignore:
      # Majors stay out of weekly-deps — see the header.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # github-actions supports `default-days` only — the semver-*-days keys
    # are not available for this ecosystem, so one flat window it is. These
    # are SHA pins (scripts/ci/check-action-pins.sh enforces that), which
    # makes a silently re-pointed tag the thing to worry about; a week of
    # daylight is cheap insurance.
    cooldown:
      default-days: 7

  # Composite actions under .github/actions/ (setup-mise, wails-build-env,
  # prepare-frontend-dist, linux-webview-deps). HAND-MERGED — see the header.
  # The glob gives each composite directory its own manifest.
  - package-ecosystem: "github-actions"
    directories: ["/.github/actions/*"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Replaces the default labels, so the two Dependabot sets are restated.
    labels: ["dependencies", "github_actions", "release-toolchain"]
    groups:
      actions-composite:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-composite-major:
        patterns: ["*"]
        update-types: ["major"]
    cooldown:
      default-days: 7
