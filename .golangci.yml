      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/profile_move_override_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/profile_move_review_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/profile_move_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/screenshot_handler\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/screenshot_handler_fuzz_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/seed\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/seed_test\.go
      - linters: [gocyclo, gocognit, funlen]
