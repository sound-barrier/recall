version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    # Bug-catchers
    - ineffassign
    - nilerr
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    # Code quality
    - unconvert
    - nakedret
    - revive
    - exhaustive
    - dupword
    - modernize
    - nestif         # deep-nesting guard (CLAUDE.md "Deep nesting / arrow code")
    - gocritic       # Go micro-smells (CLAUDE.md smells catalog)
    - unparam        # unused parameters / always-same results are dead weight
    # The complexity gate (CLAUDE.md "McCabe cyclomatic complexity ≤ 10 —
    # enforced"). Files still above threshold carry an entry in the
    # campaign carve-out block under exclusions.rules below; every cleanup
    # commit deletes its own entries, and warn-unused flags stale ones.
    - gocyclo
    - gocognit       # cognitive backstop — catches nested-but-≤10-McCabe code
    - funlen         # length backstop for straight-line sprawl the others miss
    # --- Added on review (drop any you don't want) ---
    - errorlint      # errors.Is/As + %w wrapping correctness; complements nilerr
    - noctx          # HTTP requests issued without a context.Context
    - usestdlibvars  # http.MethodGet / http.StatusOK instead of literals
    - perfsprint     # fmt.Sprintf -> faster strconv equivalents
    - nolintlint     # keeps //nolint directives specific + explained
    - thelper        # test helpers must call t.Helper()
    - predeclared    # flags shadowing of len/error/string/etc.
    - gosec          # Go-idiom SAST (rolled in from the standalone gosec job)
    - whitespace     # no blank lines at start/end of func bodies (the gofumpt rule)
  settings:
    errcheck:
      # NOTE: (*os.File).Close is intentionally NOT excluded — its error is
      # checked by default (a failed flush on a writable file is silent data
      # loss). Silence it per-call where it's genuinely not actionable, e.g.
      # on a read-only file:  //nolint:errcheck // read-only, close err not actionable
      exclude-functions:
        - "(*database/sql.Rows).Close"
        - "os.RemoveAll"
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104  # "unhandled errors" — same check as errcheck; double-reports now both run
        # G304 (file path from variable) and G302/G306 (file perms) will still
        # fire in prod — review those case-by-case rather than excluding globally.
    gocyclo:
      # ≤ 10 allowed; VERIFIED against known-complexity functions that the
      # linter flags strictly-greater-than this value.
      min-complexity: 10
    gocognit:
      min-complexity: 20
    funlen:
      lines: 60
      statements: 40
      # Load-bearing: this codebase documents densely (parseRank is ~half
      # comments) — don't tax documentation as length.
      ignore-comments: true
    misspell:
      # American English (CLAUDE.md "Language: American English") — without
      # a locale, misspell passes valid British spellings straight through.
      locale: US
    nolintlint:
      require-explanation: true  # every //nolint must say why
      require-specific: true     # must name the linter, e.g. //nolint:errcheck
      allow-unused: false        # flag //nolint directives that suppress nothing
    revive:
      rules:
        # Project style: no mandatory doc comments — conflicts with "no comments
        # by default" convention in CLAUDE.md.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        # Blank imports for side-effect registration (sqlite driver, image/jpeg
        # decoder) are idiomatic; comments would add noise with no value.
        - name: blank-imports
          disabled: true
        # http.Handler signatures must include *http.Request even when unused;
        # renaming to _ would harm readability across all handlers.
        - name: unused-parameter
          disabled: true
  exclusions:
    warn-unused: true  # report exclusion rules that no longer match anything
    paths:
      # npm packages can ship Go source (flatted bundles a Go port of its
      # codec); nothing under node_modules is ours to lint.
      - frontend/node_modules
    rules:
      # ── COMPLEXITY-CAMPAIGN CARVE-OUTS ──────────────────────────────
      # Files still above the gocyclo/gocognit/funlen gate. Each cleanup
      # commit deletes its own entries; the campaign finale deletes the
      # whole block. warn-unused (above) flags any entry that goes stale.
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/bundle_validate_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/check_for_update_test\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/dedup\.go
      - linters: [gocyclo, gocognit, funlen]
        path: pkg/app/diagnostic_test\.go
      - linters: [gocyclo, gocognit, funlen]
