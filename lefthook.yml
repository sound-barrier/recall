# Lefthook pre-commit hooks.
# Install:  mise install && lefthook install   (lefthook is pinned in mise.toml)
# Skip a hook for one commit: LEFTHOOK_EXCLUDE=name-of-hook git commit ...
# Skip all hooks for one commit: LEFTHOOK=0 git commit ...
#
# Hooks here run on a per-commit basis against ONLY the files in the
# staged diff (the {staged_files} placeholder). Pre-push hooks (further
# down) run whole-project sweeps to match CI scope, so a green pre-push
# guarantees a green CI lint + deadcode + coverage + schemathesis.
#
# DO NOT use `LEFTHOOK=0` to "fix" a push that lefthook blocked. If a
# hook fails, that's the hook doing its job — read the output, fix the
# underlying issue, and push again. Bypassing ships the regression to
# CI and burns a CI round. The only legitimate `LEFTHOOK=0` use is
# truly emergent hotfixes (security / outage) where CI failure is
# acceptable.

pre-commit:
  parallel: true
  commands:
    # ── Go ────────────────────────────────────────────────────────────
    # golangci-lint owns the formatters (gci import groups + gofmt -s) per
    # .golangci.yml; `fmt` applies them to the staged files, then `run --fix`
    # lints + autofixes.
    golangci-lint-fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD~ --fix
      stage_fixed: true

    # ── Frontend ──────────────────────────────────────────────────────
    eslint:
      root: "frontend"
      # Whole tree, not just src/ — tests, e2e specs, config files and
      # .cjs build scripts are all linted (see eslint.config.js: only
      # generated artifacts are ignored). The generated API types are
      # excluded so the hook doesn't pass an ignored file to eslint.
      glob: "**/*.{ts,vue,js,cjs}"
      exclude: "src/client/**"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    stylelint:
      root: "frontend"
      glob: "src/**/*.{css,vue}"
      run: npx stylelint --fix {staged_files}
      stage_fixed: true

    # ── OpenAPI ───────────────────────────────────────────────────────
    # Defer to the task; its glob already scopes this to api/openapi.yaml,
    # which is the only spec, so linting the staged file == `task
    # lint-openapi`. The Spectral pin lives in mise.toml [env]
    # (SPECTRAL_VERSION) and is injected by mise activation.
    spectral:
      glob: "api/openapi.yaml"
      run: task lint-openapi

    gen-types:
      glob: "api/openapi.yaml"
      run: task gen-types
      stage_fixed: true

    # ── YAML / Shell ──────────────────────────────────────────────────
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}
      exclude: "api/openapi.yaml"  # Spectral handles this

    # shfmt + shellcheck on staged shell scripts. Same flags as
    # `task lint-shell` (the CI target) so the hook catches what CI
    # would catch — without this, format-only drift (e.g. `done <
    # "$F"` vs `done <"$F"`) sails through every push and fails CI
    # at the lint job. `--write` autofixes formatting; `stage_fixed`
    # re-stages the diff so the commit includes the canonical form.
    shfmt:
      glob: "*.sh"
      run: shfmt -i 2 -ci -bn -w {staged_files}
      stage_fixed: true

    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # ── TOML / SQL / JSON ─────────────────────────────────────────────
    # taplo formats staged TOML (config in .taplo.toml); stage_fixed
    # re-stages so the commit carries the canonical form. Mirrors shfmt.
    taplo:
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true

    # sqlfluff lints staged SQL (dialect sqlite, config in .sqlfluff).
    # Lint-only: `sqlfluff fix` reformats aggressively, so autofix stays a
    # deliberate CLI step rather than a surprise mid-commit rewrite.
    sqlfluff:
      glob: "*.sql"
      run: sqlfluff lint {staged_files}

    # Biome checks + formats staged JSON/JSONC (config in biome.jsonc,
    # which excludes generated JSON — testdata goldens, package-lock,
    # e2e snapshots). --write autofixes; stage_fixed re-stages. Runs via
    # npx (BIOME_VERSION from mise.toml [env]) like the Spectral/md hooks.
    # --no-errors-on-unmatched: lefthook passes {staged_files} explicitly,
    # which bypasses biome.json's `files.includes` exclusions — so a commit
    # whose staged JSON is ENTIRELY excluded (e.g. only Playwright
    # *-snapshots/ baselines) made biome exit 1 with "No files were
    # processed" and blocked the commit. Same class as the frontend hooks'
    # "no files for inspection" skip; nothing to check is not a failure.
    biome-json:
      glob: "*.json"
      run: npx --yes "@biomejs/biome@$BIOME_VERSION" check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # ── Python ────────────────────────────────────────────────────────
    # ruff lint + format on staged .py. Same tool as `task lint-py` / CI.
    # `check --fix` and `format` autofix; stage_fixed re-stages so the
    # commit carries the canonical form. Rule selection is in ruff.toml.
    ruff:
      glob: "*.py"
      run: |
        ruff check --fix {staged_files}
        ruff format {staged_files}
      stage_fixed: true

    # ── Spell-check ───────────────────────────────────────────────────
    # typos is a Rust binary, ~50ms on a typical staged-file set. Config
    # lives in _typos.toml at the repo root (excludes auto-generated
    # files + whitelisted false positives). `--force-exclude` makes
    # typos honor _typos.toml's `extend-exclude` patterns even when
    # filenames are passed as explicit positional args (which is
    # what lefthook does via {staged_files}); without the flag,
    # explicit-arg files bypass the exclude list and PNG byte streams
    # get scanned as text.
    typos:
      run: typos --force-exclude {staged_files}

    # ── Markdown ──────────────────────────────────────────────────────
    # Config in .markdownlint-cli2.yaml at the repo root. --fix runs
    # the autofix-safe rules (MD031 blanks-around-fences, MD022
    # blanks-around-headings, MD004 ul-style); errors that remain
    # after --fix are real bugs (broken anchors, missing alt text).
    markdownlint:
      glob: "*.md"
      exclude: "CHANGELOG.md"
      run: npx --yes markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

# Pre-push: the FAST core only (~a minute) — the checks most likely to
# catch a broken push before it burns a CI round-trip. Everything that
# used to run here (coverage gate, bundle budget, Playwright smoke,
# schemathesis, semgrep, complexity, deadcode/knip, the whole-project
# lint sweeps) still gates in CI and is bundled into `task verify` for
# an on-demand full local battery. Skip a hook with
# LEFTHOOK_EXCLUDE=<name> git push.
pre-push:
  parallel: true
  commands:
    # actionlint + the SHA-pin policy — Go binary, ~50ms across the
    # workflows; catches deprecated inputs, run-block shellcheck issues,
    # and tag-pinned actions before CI does.
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        set -e
        actionlint .github/workflows/*.yml
        bash scripts/ci/check-action-pins.sh

    # Go unit tests — same -race -short set CI's test-unit job runs
    # (goldens are -short-gated). The single highest-signal pre-push
    # check: a red here is a guaranteed red CI.
    unit-go:
      glob: "{*.go,go.mod,go.sum}"
      run: go test -race -short ./...

    # Frontend unit tests — Vitest without coverage instrumentation
    # (the coverage GATE runs in CI + `task verify`).
    unit-frontend:
      glob: "frontend/**"
      run: cd frontend && npx vitest run

    # Generated-client drift — regenerating src/client must be a no-op;
    # otherwise api/openapi.yaml changed without `task gen-types`.
    gen-types-drift:
      glob: "{api/openapi.yaml,frontend/src/client/**}"
      run: |
        set -e
        cd frontend && npm run gen:types && cd ..
        # git status --porcelain, not git diff: a regeneration can emit a NEW
        # file into the multi-file client tree, which diff (tracked-only)
        # would silently miss.
        if [ -n "$(git status --porcelain frontend/src/client)" ]; then
          echo "generated API client is out of sync with api/openapi.yaml — run 'task gen-types' and commit"
          exit 1
        fi

    # Test-skip drift gate — same allow-list diff CI runs; a new t.Skip
    # without a scripts/ci/test-skips-allow.txt entry fails before push.
    test-skips:
      glob: "pkg/**/*_test.go"
      run: bash scripts/ci/check-test-skips.sh

# Commit-message format check (optional but pairs with release-please).
# Enable conventional commits via `commit-msg` hook — see release-please
# workflow for how commit messages drive automated versioning.
commit-msg:
  commands:
    conventional:
      # Match: feat:, fix:, chore:, docs:, refactor:, test:, perf:,
      # build:, ci:, revert:, style:. Optional scope in parens.
      # Optional `!` for breaking changes. Reject anything else.
      run: |
        first_line=$(head -n1 "{1}")
        if echo "$first_line" | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert|style)(\([a-z0-9_-]+\))?!?: .+'; then
          exit 0
        fi
        echo "Commit subject must follow Conventional Commits format:"
        echo "  <type>(<scope>)?(!)?: <description>"
        echo "  e.g. feat(parser): add Suravasa map alias"
        echo "       fix: rename brand-grey CSS var to brand-gray"
        echo "Allowed types: feat, fix, chore, docs, refactor, test, perf, build, ci, revert, style"
        echo "Bypass: LEFTHOOK_EXCLUDE=conventional git commit ..."
        exit 1
