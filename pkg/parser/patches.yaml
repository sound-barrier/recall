# Game patches — used to split "before this changed" from "after".
#
# Boundaries are UTC instants (RFC 3339), same convention as seasons.yaml, and
# a match belongs to the patch window its START falls in.
#
# MID-SEASON PATCHES ONLY. Every season start is also a patch, and those come
# from seasons.yaml rather than being copied here: the four that used to sit in
# this file were byte-identical to that file's `start` values, which is one
# fact with two homes — and only one of them reachable by a data update. A
# corrected season start would have moved the season filter and left the patch
# split on the old boundary.
#
# The list is EMPTY on purpose rather than seeded. Mid-season balance patches
# are real and frequent, but their dates are not something this repo can
# derive, and a plausible-looking invented date is worse than a missing one: it
# would split a player's history at a moment nothing happened and invite them
# to explain the difference.
#
# Adding a patch: append an entry, rebuild. Like seasons.yaml this file is
# embedded AND published through Apply Data Update, so a date added here
# reaches an installed copy without a release.
patches: []
