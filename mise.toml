# mise — toolchain + environment manager (https://mise.jdx.dev).
#
# Single source of truth for the dev/lint/build toolchain AND the project
# environment. Replaces the old `tool-versions.env` (version pins) and
# `.envrc` (direnv). `task` (go-task) runs the build recipes; mise provisions
# the tools they call.
#
# After cloning:   mise trust && mise install
# Update pins:     `task update-mise` (bumps every [tools] pin except go,
#                  golangci-lint, gobco and wails3, which each move as their
#                  own change), or edit one below and run `mise install`.
#                  `task check-deps` compares the pins against upstream.
#
# Tesseract (the OCR runtime the parser shells out to) and the container
# runtime (podman/docker) are NOT managed here — they're system packages
# installed via Homebrew / apt (see Brewfile + initialize.sh).
#
# mise.lock records the exact version of every [tools] entry and, for each core
# and aqua tool, its download URL and SHA-256 on every lockfile_platforms entry
# (go: and pipx: tools are version-only). CI installs with --locked, so a
# prebuilt tool a CI job runs is the one reviewed in this repo.
#
# min_version equals the mise that .github/actions/setup-mise and
# scripts/install-mise.sh pin and that wrote mise.lock: mise 2026.9.3 through
# 2026.9.6 read only lockfile version 1, and a newer local mise writes version 2
# for a NEW lockfile. Bump them together, and regenerate the lock with that
# exact binary.
min_version = "2026.9.3"

[settings]
# Read mise.lock on every install and keep it current when a pin changes.
lockfile = true
# CI (linux-x64) plus every platform a contributor can develop on, including
# devcontainers on Apple Silicon (linux-arm64). Resolving only these keeps the
# lock free of platforms nobody installs on.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]
# `task update-mise` and any fuzzy request only move to releases at least seven
# days old, the cooldown the npm and Go dependencies keep. Exact pins are not
# filtered, and pipx tools' transitive dependencies are not age-gated.
minimum_release_age = "7d"
# With uv on PATH, newer mise records a uv dependency graph for pipx tools that
# the uv-less CI runners cannot replay under --locked. pipx keeps those entries
# version-only.
pipx.uvx = false

[env]
# Keep settings + the SQLite DB under the repo's data/ dir so it's easy to
# inspect with GoLand / sqlite3 (was `.envrc`). Released app launches don't
# load mise, so the platform user-config dir applies — see appDataDir() in
# pkg/app/settings.go for the fall-through.
RECALL_DATA_DIR = "{{config_root}}/data"

# Version pins consumed as STRINGS by the Taskfile (task lint-semgrep), the
# scripts (check-deps, check-api-drift), and CI (was `tool-versions.env`). The
# matching tool binaries are pinned in [tools] below; these strings drive the
# pipx invocations outside mise and the `task check-deps` upstream comparison.
# The npm CLIs listed in tools/package.json are pinned in
# tools/package-lock.json instead.
TYPOS_VERSION = "v1.50.2"
SEMGREP_VERSION = "1.177.0"
# gobco (condition/branch coverage) is a MEASUREMENT tool: the version changes
# the number it reports, so a bump is a re-baseline decision. CI's
# branch-coverage job greps this into $GITHUB_ENV to label its summary; its
# `go install` names the version literally, so bump that line with this one
# and the [tools] pin.
GOBCO_VERSION = "v1.3.4"
SCHEMATHESIS_VERSION = "4.27.1"
# jsonschema-rs is a TRANSITIVE dependency of schemathesis, and pinning
# schemathesis does not pin it: `pipx install schemathesis==X` resolves it
# fresh on every CI run, which is a hole straight through the 7-day dependency
# cooldown the rest of the repo keeps.
#
# It cost a day. 0.50.0 landed 2026-08-20T17:27Z and removed
# CanonicalSchema.is_satisfiable, which schemathesis 4.24.3 calls at
# specs/openapi/_hypothesis.py:1209 — so every run after that hour died with
# 58 Runtime Errors across two thirds of the API, on main and every branch
# alike, with nothing in the repo having changed. Unpin it and that recurs the
# next time the crate lands a breaking release.
JSONSCHEMA_RS_VERSION = "0.56.0"
TESSERACT_VERSION = "5.5.3"
RUFF_VERSION = "0.16.7"
SQLFLUFF_VERSION = "4.3.0"

# Pin Go to the exact mise-installed toolchain so `go build`/`go test` never
# auto-download a different one (parity with what actions/setup-go@v6 set in CI).
GOTOOLCHAIN = "local"

[tools]
# Every entry is an exact release, never "latest" or a bare major: a floating
# pin installs whatever upstream published that morning, so two machines (or a
# CI rerun) can lint with different tools, and a compromised release lands
# everywhere at once. Bump deliberately, and only to a release at least seven
# days old, the same cooldown the npm and Go dependencies keep.

# Language runtimes (match go.mod / CI).
go = "1.27.1"
# Keep in sync with the root .node-version (consumed by actions/setup-node
# in CI); `task check-deps` asserts the two agree.
node = "26.8.2"

# The task runner itself, so `mise install` bootstraps a complete toolchain
# on any platform (CI / Linux). Homebrew users can also `brew install
# go-task/tap/go-task`; whichever is first on PATH wins.
task = "3.53.1"

# Linters / formatters / scanners — registry-backed prebuilt binaries.
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
yamllint = "1.38.0"
typos = "1.50.2"
ruff = "0.16.7"
# taplo publishes no checksums, so `mise lock` records only its URLs. Its
# SHA-256 lines in mise.lock were hashed from the release assets by hand; `mise
# lock` keeps them, but a version bump writes URL-only entries to hash again.
taplo = "0.10.0"
trivy = "0.74.0"
lefthook = "2.1.12"
jq = "1.8.2"
# actionlint checks that a workflow is valid; zizmor checks that it is safe
# (credential persistence, dangerous triggers, template injection, impostor
# commits). Resolved from aqua, which verifies the release's GitHub
# build-provenance attestation at install time.
zizmor = "1.30.1"

# Go-source tools built from source with the pinned Go → go: backend (same
# import paths the old `go install` bootstrap used). golangci-lint lives here
# (not the registry) on purpose: a prebuilt binary compiled with an older Go
# rejects a project targeting a newer Go directive, so it must be compiled with
# this toolchain's Go — exactly what `go install …@latest` did in CI before.
# A lint-version change alters what the gate flags, so a golangci-lint bump
# is its own change: pick the version, run the sweep, fix what it surfaces,
# commit both together.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.13.2"
"go:golang.org/x/tools/cmd/deadcode" = "v0.50.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
# Condition (branch) coverage — an informational report, never a gate. Go's
# own -cover only does statements; gobco instruments each boolean expression
# and reports the conditions never observed BOTH true and false. The version
# moves the number, so a bump is a re-baseline (see GOBCO_VERSION in [env]).
"go:github.com/rillig/gobco" = "v1.3.4"
# Wails v3 CLI (beta) — drives the v3 Taskfile-native build under build/. Keep
# in lockstep with the wails/v3 module in go.mod: the CLI generates bindings the
# module has to understand, so a split between them fails at generate time, not
# at build time.
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.22"
# Secret scanner for commits and staged changes (config .gitleaks.toml). Built
# from source and checked against the Go checksum database rather than trusting
# a checksums file from the same release. The module path still reads
# zricethezav although the repository moved to github.com/gitleaks.
"go:github.com/zricethezav/gitleaks/v8" = "v8.30.1"

# CI-only reporters (JUnit XML for the test job, Cobertura XML for the Go
# coverage job). Devs get them too via `mise install`. CI's setup-go jobs run
# `go install <module>@<this version>` instead (as they do for deadcode,
# govulncheck, gobco and task), so a bump here edits those lines too.
"go:github.com/jstemmer/go-junit-report/v2" = "v2.1.0"
"go:github.com/boumenot/gocover-cobertura" = "v1.5.0"

# Python tools (isolated venvs) → pipx backend.
"pipx:semgrep" = "1.177.0"
"pipx:schemathesis" = "4.27.1"
"pipx:sqlfluff" = "4.3.0"
